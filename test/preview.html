<!DOCTYPE html>
<meta charset="utf-8">
<title>abc2svg-cantoreshu preview</title>
<!--
  Open this straight off the disk - no server needed.  It loads the built
  ../abc2svg-1.js, so run ./build first, and reload after every rebuild.

  The point of this page is the one thing test/harness.mjs cannot do: in a
  browser lyric_ascent() measures the real face with a canvas, instead of
  falling back to .78 of the line height.  The numbers here are the ones the
  application will see; the ones in the tests are not.

  The faces come from Google Fonts, so the page wants a network on first load.
  Offline it falls back to a local serif and the metrics change accordingly.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Merriweather:ital,wght@0,300..900;1,300..900&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap">
<style>
:root { color-scheme: light dark }
body { margin: 0; font: 14px system-ui, sans-serif; display: grid;
       grid-template-columns: 25rem 1fr; height: 100vh }
#panel { padding: 1rem; overflow: auto; border-right: 1px solid #8888;
         display: flex; flex-direction: column; gap: .75rem }
#out { padding: 1rem; overflow: auto; background: #fff }
textarea { width: 100%; height: 13rem; font: 12px ui-monospace, monospace }
label { display: grid; grid-template-columns: 10.5rem 1fr auto; gap: .5rem;
        align-items: center }
input[type=range] { width: 100% }
#err { color: #c00; white-space: pre-wrap; font: 12px ui-monospace, monospace }
#facts { font: 12px ui-monospace, monospace; opacity: .85; white-space: pre }
svg { display: block }
</style>

<div id="panel">
  <label>fixture
    <select id="fixture"></select><span></span></label>
  <label>%%lyricfirstskipfac
    <input type="range" id="first" min="0" max="4" step="0.05" value="1">
    <output id="firstv">1</output></label>
  <label>%%lyricskipfac
    <input type="range" id="skip" min="0" max="3" step="0.05" value="1.2">
    <output id="skipv">1.2</output></label>
  <label>vocal font
    <select id="font">
      <option selected>Alegreya</option>
      <option>EB Garamond</option>
      <option>Merriweather</option>
      <option>Inter</option>
      <option>serif</option>
    </select><span></span></label>
  <label>vocal size
    <input type="range" id="size" min="8" max="48" step="1" value="36">
    <output id="sizev">36</output></label>
  <textarea id="abc" spellcheck="false"></textarea>
  <div id="facts"></div>
  <div id="err"></div>
</div>
<div id="out"></div>

<script src="../abc2svg-1.js"></script>
<script>
// Two stanzas, so the %%lyricskipfac grade can be judged on the case it is
// for - a descender of one line under an accented capital of the next, 'gy'
// under 'Á'.  The last bar of each line drops to F, so the ink clearance is
// visible on one system and not on the other.
const TWO_STANZAS = `X:1
M:4/4
L:1/4
K:F
F G A B | c2 A2 |
G F E F | F,4 |]
w: Áld-jad é-nek-szó-val | Jöjj gyer-mek hoz-zám |
w: Így gyűjt-jük ösz-sze mind | Ágy-ban pi-hen-jünk |
`

const FIXTURES = {
  'two stanzas': TWO_STANZAS,
  'low note under one syllable': 'X:1\nK:C\nL:1/4\nA,\nw: D\n',
  'stemless whole notes (the minimum)':
    'X:1\nK:C\nL:1/4\nc4|e4|\nw: la la\nw: ti ti\n',
  hymn: 'X:1\nK:Eb\nL:1/4\n'
    + 'E F G G | G A c2 | B4 | E F G G | G A B2 | G4 | B B c B | A G F G |'
    + ' B A G2 | F4 | B B c B | A G F G | A G F2 | E4 |]\n'
    + 'w: Áld-jad em-ber e nagy Jó-dat, Ke-nyér-szín-ben'
    + ' Meg-vál-tó-dat.\n',
}

const $ = (id) => document.getElementById(id)

for (const name of Object.keys(FIXTURES)) {
  const o = document.createElement('option')
  o.textContent = name
  $('fixture').append(o)
}
$('abc').value = TWO_STANZAS

function render() {
  const first = $('first').value, skip = $('skip').value
  const size = $('size').value, family = $('font').value
  $('firstv').value = first; $('skipv').value = skip; $('sizev').value = size

  let svg = '', errs = []
  const abc = new abc2svg.Abc({
    img_out: (s) => { svg += s },
    errmsg: (m) => { errs.push(m) },
    read_file: () => null,
  })
  try {
    abc.tosvg('preview',
      '%%pagewidth 642.52px\n%%pagescale 1\n%%musicspace 0\n%%topspace 0\n'
      + '%%vocalspace 0\n'
      + `%%vocalfont "${family}" ${size}\n`
      + `%%lyricfirstskipfac ${first}\n%%lyricskipfac ${skip}\n`
      + $('abc').value)
  } catch (e) { errs.push(String(e)) }

  $('out').innerHTML = svg
  $('err').textContent = errs.join('\n')

  // what the engine had to measure with, and where it put each system
  const c = document.createElement('canvas').getContext('2d')
  c.font = `${size}px "${family}"`
  const m = c.measureText('Áy')
  const ys = [...svg.matchAll(/<text class="f\d+" x="[\d.]+" y="([-\d.]+)"/g)]
                .map((x) => +x[1])
  const n = (v) => (v === undefined ? '     -' : v.toFixed(2).padStart(6))
  $('facts').textContent =
      `letters  (used)  ${n(m.actualBoundingBoxAscent)}   Áy, actual ink\n`
    + `font design box  ${n(m.fontBoundingBoxAscent)}   holds every diacritic\n`
    + `.78 fallback     ${n(size * 0.78)}   headless only\n`
    + `loaded face      ${document.fonts.check(c.font)}\n`
    + `lyric baselines  ${[...new Set(ys)].join(', ')}`
}

// A canvas measureText() does not pull a webfont in, so ask for it by hand
// before rendering - otherwise the first render measures the fallback face.
function reload() {
  const family = $('font').value
  document.fonts.load(`${$('size').value}px "${family}"`)
    .then(render, render)
}

$('fixture').addEventListener('change', (e) => {
  $('abc').value = FIXTURES[e.target.value]
  render()
})
$('font').addEventListener('change', reload)
$('size').addEventListener('input', reload)
for (const id of ['first', 'skip', 'abc'])
  $(id).addEventListener('input', render)

document.fonts.ready.then(reload)
reload()
</script>
