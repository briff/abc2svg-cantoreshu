name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate, but do not publish'
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # registry-url is deliberately unset: it writes an .npmrc auth line
          # that stops the npm CLI from starting the OIDC exchange when there
          # is no NODE_AUTH_TOKEN. registry.npmjs.org is the default anyway.
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Debug OIDC claims
        run: |
          node --input-type=module -e '
            const url = `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org`;
            const res = await fetch(url, {
              headers: { authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            });
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url"));
            const interesting = ["sub", "repository", "repository_owner", "repository_owner_id",
              "repository_id", "workflow_ref", "job_workflow_ref", "ref", "environment", "aud"];
            console.log(JSON.stringify(Object.fromEntries(
              interesting.map((k) => [k, claims[k]])), null, 2));
          '
      - name: Publish if version was bumped
        run: node scripts/publish-if-bumped.mjs ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NPM_CONFIG_LOGLEVEL: verbose
      - name: Dump npm debug log
        if: failure()
        run: cat ~/.npm/_logs/*-debug-0.log
